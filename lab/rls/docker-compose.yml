# Disposable Postgres for the RLS lab (ADR-002).
# The superuser is only for creating roles and the schema; tests never connect
# as it, because a superuser bypasses RLS and the tests would pass vacuously.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lab_rls
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab_rls"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
