  # ---------------------------------------------------------------------------------------------
  # Ingresos frente a gastos
  # ---------------------------------------------------------------------------------------------
  - id: GS-037
    question: "¿Cuánto ahorré cada mes de 2025?"
    user_id: 8
    category: ingresos_vs_gastos
    difficulty: dificil
    behavior: answer
    ordered: true
    notes: "Ahorro = ingresos menos gastos del mes. Hay que combinar las dos vistas."
    reference_sql: |
      SELECT mes, SUM(importe) AS ahorro
      FROM (
        SELECT to_char(fecha, 'YYYY-MM') AS mes, ingreso_eur AS importe
        FROM v_ingresos
        WHERE fecha >= '2025-01-01' AND fecha < '2026-01-01'
        UNION ALL
        SELECT to_char(fecha, 'YYYY-MM') AS mes, -gasto_eur AS importe
        FROM v_gastos
        WHERE fecha >= '2025-01-01' AND fecha < '2026-01-01'
      ) movimientos
      GROUP BY mes
      ORDER BY mes
      LIMIT 12

  - id: GS-038
    question: "¿Cuánto ahorré en total en 2025?"
    user_id: 9
    category: ingresos_vs_gastos
    difficulty: media
    behavior: answer
    reference_sql: |
      SELECT
        (SELECT SUM(ingreso_eur) FROM v_ingresos WHERE fecha >= '2025-01-01' AND fecha < '2026-01-01')
        - (SELECT SUM(gasto_eur) FROM v_gastos WHERE fecha >= '2025-01-01' AND fecha < '2026-01-01') AS ahorro
      LIMIT 1

