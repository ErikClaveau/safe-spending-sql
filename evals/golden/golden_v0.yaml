  - id: GS-020
    question: "¿Mi gasto mensual medio de los meses completos de 2026 es mayor que el de 2025?"
    user_id: 15
    category: comparativa_temporal
    difficulty: dificil
    behavior: answer
    notes: "Meses completos de 2026: de enero a agosto. Septiembre está a medias y no cuenta; el año 2025 son doce meses."
    reference_sql: |
      SELECT
        SUM(gasto_eur) FILTER (WHERE fecha >= '2026-01-01' AND fecha < '2026-09-01') / 8 AS media_mensual_2026,
        SUM(gasto_eur) FILTER (WHERE fecha >= '2025-01-01' AND fecha < '2026-01-01') / 12 AS media_mensual_2025
      FROM v_gastos
      WHERE fecha >= '2025-01-01' AND fecha < '2026-09-01'
      LIMIT 1

