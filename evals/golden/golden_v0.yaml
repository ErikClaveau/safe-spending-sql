        SUM(gasto_eur) FILTER (WHERE fecha >= '2025-11-01' AND fecha < '2025-12-01') AS noviembre
      FROM v_gastos
      WHERE fecha >= '2025-11-01' AND fecha < '2026-01-01'
      LIMIT 1

