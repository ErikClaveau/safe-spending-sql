    notes: "Media de los meses completos con recibo de suministros (de octubre de 2024 a agosto de 2026)."
    reference_sql: |
      SELECT AVG(mensual) AS media_mensual
      FROM (
        SELECT to_char(fecha, 'YYYY-MM') AS mes, SUM(gasto_eur) AS mensual
        FROM v_gastos
        WHERE categoria = 'Suministros'
          AND fecha >= '2024-10-01' AND fecha < '2026-09-01'
        GROUP BY to_char(fecha, 'YYYY-MM')
      ) por_mes
      LIMIT 1

