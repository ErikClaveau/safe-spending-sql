  - id: GS-011
    question: "¿Cuánto gasté en cuidado personal?"
    user_id: 4
    category: agregado_simple
    difficulty: media
    behavior: answer
    scenario_id: "004-zero_category"
    notes: "Es un 0 de verdad, no falta de datos: el usuario tiene movimientos en todo el periodo pero nunca gasta en esta categoría."
    reference_sql: |
      SELECT COALESCE(SUM(gasto_eur), 0) AS gasto_total
      FROM v_gastos
      WHERE categoria = 'Cuidado personal'
      LIMIT 1

