  # ---------------------------------------------------------------------------------------------
  # Comparativa temporal
  # ---------------------------------------------------------------------------------------------
  - id: GS-013
    question: "¿Gasté más en ocio este trimestre que el anterior?"
    user_id: 8
    category: comparativa_temporal
    difficulty: dificil
    behavior: answer
    notes: "'Ocio' es el grupo 'Ocio y viajes'. El trimestre actual está a medias (hasta el 15 de septiembre): la respuesta debe decirlo."
    reference_sql: |
      SELECT
        SUM(gasto_eur) FILTER (WHERE fecha >= '2026-07-01' AND fecha < '2026-10-01') AS este_trimestre,
        SUM(gasto_eur) FILTER (WHERE fecha >= '2026-04-01' AND fecha < '2026-07-01') AS trimestre_anterior
      FROM v_gastos
      WHERE grupo_categoria = 'Ocio y viajes'
        AND fecha >= '2026-04-01'
      LIMIT 1

