  - id: GS-043
    question: "¿En qué meses de 2025 gasté más de lo que ingresé?"
    user_id: 10
    category: ingresos_vs_gastos
    difficulty: dificil
    behavior: answer
    ordered: true
    reference_sql: |
      SELECT mes, ingresos, gastos
      FROM (
        SELECT mes, SUM(ingresos) AS ingresos, SUM(gastos) AS gastos
        FROM (
          SELECT to_char(fecha, 'YYYY-MM') AS mes, ingreso_eur AS ingresos, 0 AS gastos
          FROM v_ingresos
          WHERE fecha >= '2025-01-01' AND fecha < '2026-01-01'
          UNION ALL
          SELECT to_char(fecha, 'YYYY-MM') AS mes, 0 AS ingresos, gasto_eur AS gastos
          FROM v_gastos
          WHERE fecha >= '2025-01-01' AND fecha < '2026-01-01'
        ) movimientos
        GROUP BY mes
      ) por_mes
      WHERE gastos > ingresos
      ORDER BY mes
      LIMIT 12

  - id: GS-044
