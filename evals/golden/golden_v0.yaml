  - id: GS-041
    question: "¿Qué porcentaje de mis ingresos de 2025 gasté?"
    user_id: 12
    category: ingresos_vs_gastos
    difficulty: dificil
    behavior: answer
    reference_sql: |
      SELECT ROUND(
        100 * (SELECT SUM(gasto_eur) FROM v_gastos WHERE fecha >= '2025-01-01' AND fecha < '2026-01-01')
        / (SELECT SUM(ingreso_eur) FROM v_ingresos WHERE fecha >= '2025-01-01' AND fecha < '2026-01-01'), 1
      ) AS porcentaje_gastado
      LIMIT 1

  - id: GS-042
    question: "¿Cuáles fueron mis ingresos totales en el segundo trimestre de este año?"
    user_id: 13
