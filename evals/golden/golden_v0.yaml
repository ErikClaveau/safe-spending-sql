  - id: GS-060
    question: "¿Cuánto dinero me han devuelto en total en Amazon?"
    user_id: 7
    category: devoluciones
    difficulty: media
    behavior: answer
    scenario_id: "007-amazon_refunds"
    reference_sql: |
      SELECT SUM(-gasto_eur) AS devuelto
      FROM v_gastos
      WHERE comercio = 'AMAZON' AND gasto_eur < 0
      LIMIT 1

  - id: GS-061
    question: "¿Cuántas compras de Amazon me devolvieron por completo?"
    user_id: 7
    category: devoluciones
    difficulty: dificil
    behavior: answer
    scenario_id: "007-amazon_refunds"
    notes: "Una devolución total es un abono por el mismo importe que una compra anterior."
    reference_sql: |
      SELECT COUNT(*) AS devoluciones_totales
      FROM v_gastos r
      JOIN v_gastos p ON p.comercio = r.comercio AND p.gasto_eur = -r.gasto_eur AND p.fecha < r.fecha
      WHERE r.comercio = 'AMAZON' AND r.gasto_eur < 0
      LIMIT 1

  - id: GS-062
    question: "¿Alguna devolución total de Amazon me llegó en un mes distinto al de la compra? ¿Cuándo?"
    user_id: 7
    category: devoluciones
    difficulty: dificil
    behavior: answer
    ordered: true
    scenario_id: "007-amazon_refunds"
    reference_sql: |
      SELECT r.fecha AS fecha_devolucion, -r.gasto_eur AS importe, p.fecha AS fecha_compra
      FROM v_gastos r
      JOIN v_gastos p ON p.comercio = r.comercio AND p.gasto_eur = -r.gasto_eur AND p.fecha < r.fecha
      WHERE r.comercio = 'AMAZON' AND r.gasto_eur < 0
        AND to_char(p.fecha, 'YYYY-MM') <> to_char(r.fecha, 'YYYY-MM')
      ORDER BY r.fecha
      LIMIT 10

