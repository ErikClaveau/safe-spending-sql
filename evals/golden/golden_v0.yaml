# Golden set v0 (plan section 4, week 2): functional questions about the evaluation users 1-15.
#
# Conventions the reference SQL follows, and the assistant is expected to follow too:
#   - "gasto" is net spending: v_gastos.gasto_eur, where refunds count negative (ADR-005).
#   - "hoy" is the reference date below: "este año" is 2026, "el mes pasado" is August 2026,
#     "este trimestre" is July to today and "el trimestre anterior" is April to June 2026.
#   - A period is written as fecha >= first day AND fecha < the day after the last one.
#   - Money moved between the user's own accounts is neither spending nor income.
#   - `fecha` is the booking date of the movement (the date ADR-008 still has to settle).
#   - Every SQL is a single SELECT over the three semantic views, with a LIMIT, and never filters
#     by user: isolation is Postgres RLS.
# The expected answers are generated (expected_v0.json): `uv run safe-spending-golden refresh`.

dataset_version: "0.5.0"
reference_date: 2026-09-15

questions:
  # ---------------------------------------------------------------------------------------------
  # Agregado simple
  # ---------------------------------------------------------------------------------------------
  - id: GS-001
    question: "¿Cuánto gasté en supermercados en marzo de 2026?"
    user_id: 8
    category: agregado_simple
    difficulty: facil
    behavior: answer
    reference_sql: |
      SELECT SUM(gasto_eur) AS gasto_total
      FROM v_gastos
      WHERE categoria = 'Supermercados'
        AND fecha >= '2026-03-01' AND fecha < '2026-04-01'
      LIMIT 1

