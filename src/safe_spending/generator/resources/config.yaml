# Generator configuration (design: docs/generator-design.md). Together with the two
# catalogs next to it, its hash goes into manifest.json.

dataset_version: "0.1.0"
seed: 20260915
reference_date: 2026-09-15
period_start: 2024-09-16

# Slice 1 generates a small population. The full design is 100 users (1-100).
n_users: 25

# Inclusive user id ranges (design 3.3).
splits:
  eval_functional: [1, 15]
  eval_adversarial: [16, 20]
  population: [21, 100]

# Statement descriptions are upper case, ASCII and truncated to this length.
statement_max_length: 70

# City weights, roughly by population.
cities:
  Madrid: 0.30
  Barcelona: 0.20
  Valencia: 0.10
  Sevilla: 0.08
  Alicante: 0.07
  Zaragoza: 0.07
  Málaga: 0.07
  Bilbao: 0.06
  Valladolid: 0.05

# Relative purchase intensity, Monday to Sunday (normalised to mean 1 when used).
weekday_weights: [0.9, 0.9, 0.9, 1.0, 1.3, 1.5, 1.2]

# Probability that a card purchase is booked 0, 1, 2 or 3 days after the operation.
card_delay_weights: [0.4, 0.3, 0.2, 0.1]

# Month factors (January to December) by category group (normalised to mean 1).
seasonality:
  Compras: [1.3, 0.9, 0.9, 1.0, 1.0, 1.0, 1.3, 0.9, 1.1, 1.0, 1.3, 1.6]
  Ocio y viajes: [0.8, 0.8, 1.0, 1.1, 1.0, 1.2, 1.5, 1.8, 1.1, 0.9, 0.9, 1.4]

archetypes:
  young_professional:
    weight: 1
    annual_net_income_eur: [22000, 38000]   # paid in 14 instalments
    rent_share: [0.25, 0.35]                # of net monthly income
    pay_day: [25, 28]
    rent_day: [1, 5]
    subscriptions: [0, 3]
    # Monthly budget by category, as a share of net monthly income. Top-down
    # calibration: income -> budget -> purchases that consume it.
    category_budget_share:
      Supermercados: 0.10
      Restaurantes y bares: 0.07
      Comida a domicilio: 0.03
      Transporte público: 0.02
      Taxi y VTC: 0.01
      Ropa y calzado: 0.04
      Electrónica: 0.02
      Hogar y bricolaje: 0.01
      Compras online: 0.04
      Ocio y cultura: 0.03
      Viajes y alojamiento: 0.04
      Farmacia: 0.01
      Cuidado personal: 0.015
