# Merchant catalog (design 4.2): companies only, never people. Real national chains for
# realism; local invented merchants for the long tail arrive in a later slice.
#
# channel:
#   card_present / card_online  card purchases, amounts ~ lognormal(median_eur, sigma)
#   subscription                fixed monthly card charge of price_eur
#   direct_debit                monthly receipt in monthly_eur [low, high] under legal_name
# weight: relative frequency among a user's habitual merchants of the category.
# variants: names as they appear on statements; {n4} is replaced by 4 random digits.

