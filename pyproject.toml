[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safe-spending-sql"
version = "0.0.0"
description = "Text-to-SQL assistant over synthetic banking data, with RLS-based isolation"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.scripts]
safe-spending-bootstrap = "safe_spending.db.bootstrap:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/safe_spending"]

[tool.pytest.ini_options]
# The RLS lab has its own Postgres: run it explicitly with `pytest lab/rls/tests`.
testpaths = ["tests"]
addopts = "-ra"
